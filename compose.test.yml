services:
  redis:
    image: redis:8.10.0-alpine
    ports:
      - "127.0.0.1:6380:6379"
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    tmpfs:
      - /data:size=64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10