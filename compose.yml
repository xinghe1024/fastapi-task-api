services:
  api:
    build:
      context: .
    image: fastapi-task-api:learning
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/tasks.db
    volumes:
      - fastapi-task-data:/data
    restart: unless-stopped

volumes:
  fastapi-task-data:
    external: true